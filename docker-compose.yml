services:
  toolich-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: toolich_app
    restart: unless-stopped
    networks:
      - proxy-network
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - TOOLICH_STORAGE_REDIS_URL=${TOOLICH_STORAGE_REDIS_URL}
      - REDIS_URL=${REDIS_URL}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  proxy-network:
    external: true