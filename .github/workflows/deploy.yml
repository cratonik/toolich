name: Deploy Toolich to VPS

on:
  push:
    branches:
      - prod # Triggers the workflow automatically whenever you push to the prod branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Securely SSH into Hostinger VPS and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Navigate to the toolich directory on your 30GB drive
            cd /data/toolich

            # Fetch the latest changes from the prod branch and overwrite local files
            git fetch origin prod
            git reset --hard origin/prod

            # Force Docker to pull new changes, rebuild the image, and restart the container
            docker compose up -d --build

            # Clean up old, dangling Docker images to keep your 30GB drive clean
            docker image prune -f
