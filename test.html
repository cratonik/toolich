<!DOCTYPE html>
<html>
<body>
  <textarea id="t" style="width: 300px; height: 100px;"></textarea>
  <button id="b">Find "hello"</button>
  <script>
    const t = document.getElementById('t');
    t.value = "abc\ndef\n".repeat(20) + "hello\n" + "ghi\njkl\n".repeat(20);
    document.getElementById('b').onclick = () => {
      const idx = t.value.indexOf("hello");
      const full = t.value;
      t.value = full.substring(0, idx + 5);
      const sh = t.scrollHeight;
      t.value = full;
      t.scrollTop = sh - t.clientHeight / 2;
      t.setSelectionRange(idx, idx + 5);
      t.focus();
    };
  </script>
</body>
</html>
